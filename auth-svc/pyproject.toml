[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth_svc"
version = "0.1.0"
description = "Auth microservice (FastAPI + SQLAlchemy + Alembic + JWT RS256)"
requires-python = ">=3.12"

dependencies = [
    # === Core ===
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "email-validator>=2.0.0,<3.0",
    # === Database ===
    "sqlalchemy>=2.0,<3.0",
    "greenlet>=3.0,<4.0",
    "alembic>=1.13,<2.0",
    "aiosqlite>=0.20,<1.0", # для тестов
    "psycopg[binary]>=3.2,<4.0", # для продакшена

    # === Auth & Security ===
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.3",
    "python-jose[cryptography]==3.3.0",
    # === Monitoring & Utilities ===
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "httpx>=0.27,<1.0",
    "python-dotenv==1.1.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "anyio>=4.4,<5.0",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

